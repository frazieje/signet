apiVersion: apps/v1
kind: Deployment
metadata:
  name: signet-deployment
  namespace: istio-system # TODO: We may want to change this, but putting as close to the ingressgateway as possible.
  labels:
    app: signet-deployment
spec:
  replicas: 1 # High availability for an ingress-critical service
  selector:
    matchLabels:
      app: signet
  template:
    metadata:
      labels:
        app: signet
    spec:
      containers:
        - name: signet
          # TODO: Replace with signet image once we have it.
          image: us-east1-docker.pkg.dev/signet-487814/http-responder/signet:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 50051
              name: grpc-port
          volumeMounts:
            - name: signet-key
              mountPath: /app/key.pem
              subPath: key.pem
              readOnly: true
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 5
      volumes:
        - name: signet-key
          secret:
            secretName: signet-key
            items:
              - key: key.pem
                path: key.pem
